# reolink-downloader — one-off Compose job for a Synology NAS / Container Manager.
#
# This uses a pre-built runtime image (published to GHCR by
# .github/workflows/docker-publish.yml) that clones the tool's source fresh from
# GitHub every time the container starts (see entrypoint.sh in the repo) — so you
# always get the latest code on `main` without ever rebuilding anything yourself.
# There's no `build:` step at all, which sidesteps Synology Container Manager's lack
# of a `git` binary (that only broke a *build-time* git clone; this container has its
# own `git` installed for its runtime clone, which Synology's host never needs to
# know about — it just `docker pull`s a ready-made image).
#
# Quick start on Synology:
#   1. Copy just this one file into a shared folder (e.g. docker/reolink-downloader)
#      via File Station — no other project files are needed.
#   2. Open Container Manager → Project → Create, set "Path" to that folder, and let
#      it pick up this docker-compose.yml.
#   3. Edit the `environment:` values below for your camera (or, for secrets you'd
#      rather not keep in this tracked file, create a sibling `.env` file in the same
#      folder — Compose substitutes `${VAR}` from it automatically).
#   4. Run once: `docker compose up` (or, in Container Manager, Action → Start — no
#      Build step needed, it only pulls). It downloads everything in the configured
#      date range and exits — it does not run on a schedule.
#   5. To fetch a new batch, edit REOLINK_START_TIME/REOLINK_END_TIME and re-run. Any
#      tool code changes on `main` are picked up automatically, every run — nothing
#      to re-download or rebuild on your end.
#
# To pin to a specific released version instead of always tracking `main`, set
# REPO_REF below to a tag or commit SHA.

services:
  reolink-downloader:
    image: ghcr.io/harvy4002/reolink-downloader:latest
    pull_policy: always
    volumes:
      - ./downloads:/downloads
      # Caches downloaded Python packages across runs so each container start
      # doesn't need to re-fetch them from PyPI after the fresh git clone.
      - uv-cache:/root/.cache/uv
    environment:
      # IMPORTANT: keep every value below quoted, even after you edit it. YAML
      # treats an unquoted date/number/boolean-shaped value (e.g. 2024-01-01,
      # or true/false) as that native type instead of a string, and Docker
      # Compose then rejects it — e.g. an unquoted REOLINK_START_TIME fails
      # with "invalid jsonType time.Time". Quotes keep it a plain string.

      # --- Which code to run. Defaults to this repo's main branch; override
      # REPO_REF to pin to a tag/commit, or REPO_URL to point at a fork. ---
      REPO_URL: "${REPO_URL:-https://github.com/harvy4002/reolink-downloader.git}"
      REPO_REF: "${REPO_REF:-main}"

      # --- Required: no defaults, so a typo/omission still gets caught by the
      # tool's own "missing required option" error rather than silently running. ---
      REOLINK_IP: "${REOLINK_IP}"              # e.g. 192.168.1.100
      REOLINK_USERNAME: "${REOLINK_USERNAME}"  # e.g. admin
      REOLINK_PASSWORD: "${REOLINK_PASSWORD}"  # e.g. changeme
      REOLINK_START_TIME: "${REOLINK_START_TIME}"  # e.g. 2024-01-01 or "2024-01-01 14:30:00"
      REOLINK_END_TIME: "${REOLINK_END_TIME}"      # e.g. 2024-01-02

      # --- Optional: shown with the tool's actual defaults. ---
      # Channel(s) to download: 'all', a single index, a comma list, a range, or a
      # combination — e.g. '0', '0,2,5', '0-3', '0,2-4,7'.
      REOLINK_CHANNEL: "${REOLINK_CHANNEL:-all}"
      # Concurrent Baichuan download connections. Reolink PoE NVRs support at most 4
      # concurrent playback streams.
      REOLINK_CONCURRENCY: "${REOLINK_CONCURRENCY:-3}"
      # wide, telephoto, or both — only matters for cameras/channels with a second
      # (telephoto) lens; automatically ignored elsewhere.
      REOLINK_LENS: "${REOLINK_LENS:-both}"
      # Cap on total recordings downloaded across all selected channels. Leave the
      # substitution default empty to download everything found.
      REOLINK_LIMIT: "${REOLINK_LIMIT:-}"
      # Skip (not retry) a single recording once it exceeds this many MB, rather than
      # risking an out-of-memory crash downloading it in full. Leave empty for no cap;
      # set this if you've actually seen the container die with no error logged.
      REOLINK_MAX_DOWNLOAD_MB: "${REOLINK_MAX_DOWNLOAD_MB:-}"
      # Print the raw Baichuan protocol exchange, for diagnosing a failed download.
      REOLINK_DEBUG: "${REOLINK_DEBUG:-false}"

      # --- Optional: Telegram notifications. Both must be set to enable them; leave
      # both empty (the default) to disable. ---
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"

      # Do NOT set REOLINK_OUTPUT here — the image fixes it to /downloads, which the
      # volume line above bind-mounts to ./downloads next to this file. Change the
      # host side of that mount instead if you want recordings written elsewhere.

    # One-off job: downloads everything in the configured date range, then exits.
    # Don't restart it automatically — re-run manually each time you want a new batch.
    # On Synology's Container Manager, make sure the project's "auto-restart" setting
    # is off for the same reason.
    restart: "no"

volumes:
  uv-cache:
