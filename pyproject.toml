[project]
name = "reolink-downloader"
version = "0.1.0"
description = "Bulk download videos from a Reolink camera"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "reolink-aio>=0.16.4",
    "aiohttp>=3.9",
]

[project.scripts]
reolink-downloader = "reolink_downloader:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
